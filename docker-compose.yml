services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile
    image: focus-auth:local
    container_name: focus-auth
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-focus}:${POSTGRES_PASSWORD:-focus}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-focus_auth}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-focus-local-jwt-secret-change-me}
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8082}
      BACKEND_INTERNAL_KEY: ${BACKEND_INTERNAL_KEY:-backend-internal-dev-key}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AUTH_PORT:-8081}:8081"
